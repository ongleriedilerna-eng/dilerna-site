<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dilerna · Aperçu iPhone</title>
  <!-- Sur un vrai téléphone : redirection vers le site en plein écran -->
  <script>
    if (window.matchMedia("(max-width: 600px), (pointer: coarse) and (max-width: 1024px)").matches) location.replace("index.html");
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=DM+Sans:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #EFE3D6; --text: #4E2E22; --muted: #7C5E50; --fuchsia: #E0218A; }
    @media (prefers-color-scheme: dark) { :root { --bg: #160E0B; --text: #F3E8DD; --muted: #BBAB9F; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "DM Sans", system-ui, sans-serif; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center; gap: 72px; padding: 24px;
      background:
        radial-gradient(40% 50% at 85% 15%, rgba(224, 33, 138, .18), transparent 70%),
        radial-gradient(35% 45% at 10% 90%, rgba(16, 175, 192, .14), transparent 70%),
        var(--bg);
    }
    .side { max-width: 340px; }
    .side h1 { font: 400 54px/1 "Gloock", serif; margin: 0 0 14px; }
    .side p { color: var(--muted); line-height: 1.6; margin: 0 0 14px; }
    .side .neon { font: 400 34px/1.1 "Sacramento", cursive; color: var(--fuchsia); margin: 18px 0; }
    .side a { display: inline-block; margin-top: 6px; padding: 12px 22px; border-radius: 999px; background: #6D1F2E; color: #FFF4EC; text-decoration: none; font-weight: 700; font-size: 14px; }
    .side a:hover { background: var(--fuchsia); }

    /* ---- iPhone (écran 393 × 852 pt) ---- */
    .phone-wrap { flex: none; transform-origin: center; }
    .phone {
      position: relative; width: calc(393px + 28px); height: calc(852px + 28px);
      padding: 14px; border-radius: 68px;
      background: linear-gradient(145deg, #3a3a3c, #1c1c1e 40%, #2c2c2e);
      box-shadow: inset 0 0 0 2px #59595d, inset 0 0 0 5px #111, 0 50px 90px -30px rgba(40, 20, 10, .55), 0 30px 40px -30px rgba(0, 0, 0, .5);
    }
    /* Boutons latéraux */
    .phone::before, .phone::after { content: ""; position: absolute; width: 4px; background: #2c2c2e; border-radius: 3px; }
    .phone::before { left: -4px; top: 190px; height: 64px; box-shadow: 0 84px 0 #2c2c2e, 0 -60px 0 -0px #2c2c2e; }
    .phone::after { right: -4px; top: 250px; height: 104px; }
    .screen { position: relative; width: 393px; height: 852px; border-radius: 55px; overflow: hidden; background: #F7F0E8; }
    .screen iframe { position: absolute; left: 0; top: 54px; width: 393px; height: calc(852px - 54px); border: 0; background: #F7F0E8; }
    .status {
      position: absolute; inset: 0 0 auto 0; height: 54px; z-index: 2;
      display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 46px;
      font: 600 17px/1 -apple-system, "SF Pro Text", "DM Sans", sans-serif; color: #111; background: #F7F0E8;
      transition: background-color .4s, color .4s;
    }
    .status.dark { background: #1E1310; color: #fff; }
    .status__icons { display: flex; gap: 6px; align-items: center; }
    .status svg { fill: currentColor; }
    .island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000; z-index: 3; }
    .home { position: absolute; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: rgba(0, 0, 0, .75); z-index: 3; pointer-events: none; }
    @media (max-width: 900px) { .side { display: none; } }
  </style>
</head>
<body>
  <div class="side">
    <h1>Dilerna</h1>
    <p>Aperçu mobile du site, au format iPhone (393 × 852). Fais défiler directement dans l'écran.</p>
    <p class="neon">Can't fix your life, can fix your nails.</p>
    <a href="index.html" target="_blank" rel="noopener">Ouvrir le site en plein écran</a>
  </div>

  <div class="phone-wrap" id="wrap">
    <div class="phone">
      <div class="screen">
        <div class="status" id="status">
          <span id="clock">9:41</span>
          <span class="status__icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.3-1.4A10.3 10.3 0 0 0 8 .5C5.2.5 2.6 1.6.7 3.5L2 4.9a8.3 8.3 0 0 1 6-2.4Zm0 4c1.2 0 2.3.5 3.2 1.2l1.4-1.4A6.4 6.4 0 0 0 8 4.5c-1.8 0-3.4.7-4.6 1.8l1.4 1.4c.9-.7 2-1.2 3.2-1.2Zm0 4 2-2a2.8 2.8 0 0 0-4 0l2 2Z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" opacity=".4"/></svg>
          </span>
        </div>
        <div class="island"></div>
        <iframe src="index.html?frame=1" title="Site Dilerna, aperçu mobile"></iframe>
        <div class="home"></div>
      </div>
    </div>
  </div>

  <script>
    // Mise à l'échelle pour que le téléphone tienne dans la fenêtre
    var wrap = document.getElementById("wrap");
    function fit() {
      var s = Math.min(1, (innerHeight - 48) / 880, (innerWidth - 48) / 421);
      wrap.style.transform = "scale(" + s + ")";
      wrap.style.margin = (-(880 * (1 - s)) / 2) + "px " + (-(421 * (1 - s)) / 2) + "px";
    }
    addEventListener("resize", fit); fit();
    // Heure réelle dans la barre d'état
    var clock = document.getElementById("clock");
    function tick() { var d = new Date(); clock.textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
    tick(); setInterval(tick, 30000);
    // Barre d'état assortie au thème du site
    addEventListener("message", function (e) {
      if (e.data && e.data.dilernaTheme) document.getElementById("status").classList.toggle("dark", e.data.dilernaTheme === "dark");
    });
  </script>
</body>
</html>
