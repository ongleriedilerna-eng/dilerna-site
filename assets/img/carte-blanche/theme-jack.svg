<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="800" height="1000">
  <!-- Illustration originale du thème « L'Étrange Noël de Monsieur Jack », aux couleurs de la pose de Marie :
       noir, blanc, rouge, et petites lumières bleues, roses et vertes (pas de jaune). -->
  <defs>
    <radialGradient id="nuit" cx="50%" cy="34%" r="75%">
      <stop offset="0" stop-color="#2A2426" />
      <stop offset=".55" stop-color="#141112" />
      <stop offset="1" stop-color="#0A0809" />
    </radialGradient>
    <radialGradient id="lune" cx="42%" cy="38%" r="65%">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset=".7" stop-color="#F1EDE8" />
      <stop offset="1" stop-color="#DDD6CF" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".16" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <pattern id="paillettes" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#B3121F" />
      <circle cx="1.5" cy="1.5" r="1" fill="#E8303F" /><circle cx="4.5" cy="4" r=".8" fill="#FF6B76" />
    </pattern>
    <filter id="lueur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3.2" /></filter>
  </defs>

  <!-- nuit -->
  <rect width="400" height="500" fill="url(#nuit)" />
  <!-- étoiles et flocons blancs -->
  <g fill="#F4F1EC">
    <circle cx="40" cy="120" r="1.4" /><circle cx="78" cy="196" r="1" /><circle cx="352" cy="128" r="1.3" /><circle cx="330" cy="236" r="1" />
    <circle cx="60" cy="300" r="1.1" /><circle cx="370" cy="320" r="1.2" /><circle cx="300" cy="96" r="1" /><circle cx="110" cy="86" r="1" />
  </g>
  <g stroke="#F4F1EC" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M58 230 v14 M51 237 h14 M53 232 l10 10 M63 232 l-10 10" />
    <path d="M346 186 v12 M340 192 h12 M342 188 l8 8 M350 188 l-8 8" />
    <path d="M330 300 v10 M325 305 h10 M326.5 301.5 l7 7 M333.5 301.5 l-7 7" />
  </g>

  <!-- grande lune blanche -->
  <circle cx="205" cy="200" r="150" fill="url(#halo)" />
  <circle cx="205" cy="200" r="112" fill="url(#lune)" />
  <g fill="#D9D2CA" opacity=".55">
    <circle cx="170" cy="168" r="14" /><circle cx="238" cy="150" r="9" /><circle cx="250" cy="232" r="16" /><circle cx="186" cy="246" r="8" />
  </g>

  <!-- colline en spirale (silhouette noire) -->
  <path d="M-10 500 L-10 420 C 40 400, 90 380, 140 342 C 186 306, 214 268, 232 236 C 244 214, 246 192, 236 178 C 226 164, 206 164, 198 178 C 190 192, 202 208, 216 204 C 226 201, 226 188, 218 186"
        fill="none" stroke="#0A0809" stroke-width="18" stroke-linecap="round" />
  <path d="M-10 500 L-10 420 C 40 400, 90 380, 140 342 C 170 320, 190 300, 205 282 C 230 330, 300 370, 410 380 L 410 500 Z" fill="#0A0809" />

  <!-- guirlande de petites lumières (bleu, rose, vert, rouge, comme sur la pose) -->
  <path d="M-10 46 C 90 110, 300 110, 410 40" fill="none" stroke="#F4F1EC" stroke-width="1.6" opacity=".85" />
  <g>
    <g transform="translate(30 70) rotate(18)"><circle r="9" fill="#2F6BFF" filter="url(#lueur)" opacity=".8" /><ellipse rx="6" ry="8" fill="#2F6BFF" /></g>
    <g transform="translate(78 89) rotate(10)"><circle r="9" fill="#FF5FA8" filter="url(#lueur)" opacity=".8" /><ellipse rx="6" ry="8" fill="#FF5FA8" /></g>
    <g transform="translate(128 99) rotate(4)"><circle r="9" fill="#34D36B" filter="url(#lueur)" opacity=".8" /><ellipse rx="6" ry="8" fill="#34D36B" /></g>
    <g transform="translate(178 103)"><circle r="9" fill="#E2192C" filter="url(#lueur)" opacity=".8" /><ellipse rx="6" ry="8" fill="#E2192C" /></g>
    <g transform="translate(228 102) rotate(-4)"><circle r="9" fill="#2F6BFF" filter="url(#lueur)" opacity=".8" /><ellipse rx="6" ry="8" fill="#2F6BFF" /></g>
    <g transform="translate(278 95) rotate(-9)"><circle r="9" fill="#FF5FA8" filter="url(#lueur)" opacity=".8" /><ellipse rx="6" ry="8" fill="#FF5FA8" /></g>
    <g transform="translate(326 80) rotate(-15)"><circle r="9" fill="#34D36B" filter="url(#lueur)" opacity=".8" /><ellipse rx="6" ry="8" fill="#34D36B" /></g>
    <g transform="translate(370 60) rotate(-20)"><circle r="9" fill="#E2192C" filter="url(#lueur)" opacity=".8" /><ellipse rx="6" ry="8" fill="#E2192C" /></g>
  </g>

  <!-- bas : rayures noires et blanches (le costume) et une bordure de paillettes rouges -->
  <g>
    <rect x="0" y="430" width="400" height="70" fill="#F4F1EC" />
    <g fill="#0A0809">
      <rect x="0" y="430" width="14" height="70" /><rect x="28" y="430" width="14" height="70" /><rect x="56" y="430" width="14" height="70" />
      <rect x="84" y="430" width="14" height="70" /><rect x="112" y="430" width="14" height="70" /><rect x="140" y="430" width="14" height="70" />
      <rect x="168" y="430" width="14" height="70" /><rect x="196" y="430" width="14" height="70" /><rect x="224" y="430" width="14" height="70" />
      <rect x="252" y="430" width="14" height="70" /><rect x="280" y="430" width="14" height="70" /><rect x="308" y="430" width="14" height="70" />
      <rect x="336" y="430" width="14" height="70" /><rect x="364" y="430" width="14" height="70" /><rect x="392" y="430" width="14" height="70" />
    </g>
    <path d="M0 430 C 40 412, 80 446, 120 426 C 160 408, 200 444, 240 426 C 280 410, 320 444, 360 426 C 380 418, 392 420, 400 424 L 400 438 L 0 438 Z" fill="url(#paillettes)" />
  </g>
</svg>
